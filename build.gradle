plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	maven { url = "https://maven.blamejared.com/" } // JEI
	exclusiveContent { // Jade, Mod Menu, Xaero's Minimap (optional integrations)
		forRepository { maven { url = "https://api.modrinth.com/maven" } }
		filter { includeGroup "maven.modrinth" }
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"arraial" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// JEI: compile against its API; the full mod only in the dev client (optional for players).
	compileOnly "mezz.jei:jei-${project.minecraft_version}-fabric-api:${project.jei_version}"
	// The dev client runs JEI, or REI with -PcomRei (they are both recipe viewers: one at a time).
	if (!project.hasProperty("comRei")) {
		localRuntime "mezz.jei:jei-${project.minecraft_version}-fabric:${project.jei_version}"
	} else {
		localRuntime "maven.modrinth:rei:${project.rei_version}"
		localRuntime "maven.modrinth:architectury-api:${project.architectury_version}"
		localRuntime "maven.modrinth:cloth-config:${project.cloth_config_version}"
	}

	// Optional integrations: compiled against, never required by players; all three run in the dev client.
	compileOnly "maven.modrinth:jade:${project.jade_version}"
	compileOnly "maven.modrinth:modmenu:${project.modmenu_version}"
	compileOnly "maven.modrinth:xaeros-minimap:${project.xaero_version}"
	compileOnly "maven.modrinth:rei:${project.rei_version}"
	compileOnly "maven.modrinth:architectury-api:${project.architectury_version}"
	localRuntime "maven.modrinth:jade:${project.jade_version}"
	localRuntime "maven.modrinth:modmenu:${project.modmenu_version}"
	localRuntime "maven.modrinth:xaeros-minimap:${project.xaero_version}"
	localRuntime "maven.modrinth:farmers-delight-refabricated:${project.farmers_delight_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
	// The automated in-game test script is for development only.
	exclude 'com/guilhermegoes/arraial/client/Roteiro*'
}

sourcesJar {
	exclude 'com/guilhermegoes/arraial/client/Roteiro*'
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
